[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "deephedge"
version = "0.1.0"
description = "Deep hedging with PyTorch: a neural network learns to hedge an option under transaction costs by minimising CVaR"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adrien Liao" }]
dependencies = ["torch>=2.1", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["deephedge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
